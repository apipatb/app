version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: laundry-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: laundry_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - laundry-network

  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - laundry-network

  app:
    build: .
    container_name: laundry-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/laundry_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - laundry-network

volumes:
  mongodb_data:
  redis_data:

networks:
  laundry-network:
    driver: bridge
